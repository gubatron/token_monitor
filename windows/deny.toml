# cargo-deny configuration. Run from windows/: cargo deny check
# TokenMon for Windows is MIT licensed; every dependency license must be
# compatible with distributing an MIT binary.

[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]

[advisories]
version = 2
yanked = "deny"

# Only "unmaintained" notices from Slint's transitive tree are ignored, each
# one narrowly by advisory ID. Vulnerability advisories are never ignored
# here. Re-check on every Slint bump: drop an entry as soon as Slint (1.18.1
# is the latest release at the time of writing) stops pulling the crate.
# `cargo tree -i <crate> --target all` shows the path.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste (proc-macro, compile time only) via slint -> image -> exr -> pulp; used by the Slint compiler, never linked into the app or reachable at run time." },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils via spin_on in slint-build, slint-macros and the skia renderer; archived but a tiny pin! helper with no known flaw; Slint owns the swap." },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser via winit -> sctk-adwaita (Wayland client-side decorations); Linux-only, absent from the Windows binary; no known vulnerability." },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names via zbus in i-slint-backend-winit (Linux desktop portals); Linux-only, absent from the Windows binary." },
    { id = "RUSTSEC-2026-0370", reason = "zvariant via zbus in i-slint-backend-winit (Linux desktop portals); Linux-only, absent from the Windows binary." },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via zbus in i-slint-backend-winit (Linux desktop portals); Linux-only proc-macro, absent from the Windows binary." },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via glib-macros (gtk-rs 0.18) under tray-icon -> libappindicator; the dependency is cfg(windows) in tokenmon-app and gtk is Linux-only, so it is absent from the Windows binary; compile-time proc-macro only." },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
    # Slint (https://slint.dev) is offered under GPL-3.0, a paid commercial
    # license, or a royalty-free license for desktop apps (requires
    # attribution, for example the AboutSlint widget or a badge). TokenMon is
    # an MIT desktop app and elects the royalty-free terms. Do NOT add
    # GPL-3.0 here: it would pull the whole app under the GPL.
    "LicenseRef-Slint-Royalty-free-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
