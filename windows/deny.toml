# cargo-deny configuration. Run from windows/: cargo deny check
# TokenMon for Windows is MIT licensed; every dependency license must be
# compatible with distributing an MIT binary.

[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
    # Slint (https://slint.dev) is offered under GPL-3.0, a paid commercial
    # license, or a royalty-free license for desktop apps (requires
    # attribution, for example the AboutSlint widget or a badge). TokenMon is
    # an MIT desktop app and elects the royalty-free terms. Do NOT add
    # GPL-3.0 here: it would pull the whole app under the GPL.
    "LicenseRef-Slint-Royalty-free-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
