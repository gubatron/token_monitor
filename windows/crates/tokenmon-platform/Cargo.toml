[package]
name = "tokenmon-platform"
description = "TokenMon OS services behind traits, with Windows implementations and in-memory fakes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# This is the only crate allowed to use `unsafe` (Win32/COM FFI). Keep every
# other lint identical to `[workspace.lints]`; each unsafe block needs a
# `// SAFETY:` comment.
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
doc_markdown = "allow"
return_self_not_must_use = "allow"
too_many_lines = "allow"
unwrap_used = "warn"
dbg_macro = "deny"
todo = "warn"
undocumented_unsafe_blocks = "warn"

[dependencies]
tokenmon-core = { workspace = true }
