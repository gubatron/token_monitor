[package]
name = "tokenmon-ui"
description = "TokenMon Slint UI components and view models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tokenmon-core = { workspace = true }
tiny-skia = { workspace = true }
chrono = { workspace = true }
slint = { workspace = true, features = ["std", "compat-1-18", "image-default-formats", "renderer-software", "backend-winit"] }
rfd = { workspace = true, features = ["xdg-portal", "pollster", "common-controls-v6"] }

[build-dependencies]
slint-build = { workspace = true }
