[package]
name = "tokenmon-ui"
description = "TokenMon Slint UI components and view models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tokenmon-core = { workspace = true }
tokenmon-provider-grok = { workspace = true }
tokenmon-provider-cursor = { workspace = true }
tokenmon-provider-grokbot = { workspace = true }
tokenmon-provider-claude = { workspace = true }
tokenmon-provider-chatgpt = { workspace = true }
tokenmon-provider-opencode = { workspace = true }
tokenmon-provider-openrouter = { workspace = true }
tiny-skia = { workspace = true }
chrono = { workspace = true }
slint = { workspace = true, features = ["std", "compat-1-18", "image-default-formats", "renderer-software", "backend-winit", "software-renderer-systemfonts"] }
rfd = { workspace = true, features = ["xdg-portal", "pollster", "common-controls-v6"] }

[build-dependencies]
slint-build = { workspace = true }

[dev-dependencies]
# Offscreen snapshot tests decode/encode PNGs.
png = "0.17"
# Text in the software renderer needs fontique; the tests register the bundled Inter fonts.
slint = { workspace = true, features = ["software-renderer-systemfonts", "unstable-fontique-011"] }
