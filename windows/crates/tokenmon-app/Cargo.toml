[package]
name = "tokenmon-app"
description = "TokenMon system-tray application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tokenmon-core = { workspace = true }
tokenmon-platform = { workspace = true }
tokenmon-ui = { workspace = true }
tokenmon-provider-grok = { workspace = true }
tokenmon-provider-cursor = { workspace = true }
tokenmon-provider-grokbot = { workspace = true }
tokenmon-provider-claude = { workspace = true }
tokenmon-provider-chatgpt = { workspace = true }
tokenmon-provider-opencode = { workspace = true }
tokenmon-provider-openrouter = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "sync"] }
chrono = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
tempfile = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "sync", "macros", "test-util"] }

[lib]
name = "tokenmon_app"
path = "src/lib.rs"

# The shipped executable is TokenMon.exe (the updater, installer and release
# workflow all expect that file name).
[[bin]]
name = "TokenMon"
path = "src/main.rs"
