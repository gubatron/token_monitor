[package]
name = "tokenmon-app"
description = "TokenMon system-tray application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tokenmon-core = { workspace = true }
tokenmon-platform = { workspace = true }
tokenmon-ui = { workspace = true }
tokenmon-provider-grok = { workspace = true }
tokenmon-provider-cursor = { workspace = true }
tokenmon-provider-grokbot = { workspace = true }
tokenmon-provider-claude = { workspace = true }
tokenmon-provider-chatgpt = { workspace = true }
tokenmon-provider-opencode = { workspace = true }
tokenmon-provider-openrouter = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "sync"] }
chrono = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
tempfile = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "sync", "macros", "test-util"] }

[lib]
name = "tokenmon_app"
path = "src/lib.rs"

# The shipped executable is TokenMon.exe (the updater, installer and release
# workflow all expect that file name).
[[bin]]
name = "TokenMon"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
slint = { workspace = true, features = ["std", "compat-1-18", "backend-winit", "renderer-software", "software-renderer-systemfonts", "unstable-winit-030"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
