[package]
name = "tokenmon-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tokenmon-platform = { path = "../crates/tokenmon-platform" }
tokenmon-core = { path = "../crates/tokenmon-core" }
chrono = { version = "0.4", default-features = false, features = ["std"] }

# Own workspace: nightly-only, never built by the stable workspace gate.
[workspace]

[[bin]]
name = "platform_shell_ipc"
path = "fuzz_targets/platform_shell_ipc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "platform_shell_cmdline"
path = "fuzz_targets/platform_shell_cmdline.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tokenmon_core_settings_decode"
path = "fuzz_targets/tokenmon_core_settings_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tokenmon_core_threshold_notifier"
path = "fuzz_targets/tokenmon_core_threshold_notifier.rs"
test = false
doc = false
bench = false
