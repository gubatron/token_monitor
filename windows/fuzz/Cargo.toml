[package]
name = "tokenmon-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
tokenmon-provider-chatgpt = { path = "../crates/tokenmon-provider-chatgpt" }
tokenmon-provider-openrouter = { path = "../crates/tokenmon-provider-openrouter" }
libfuzzer-sys = "0.4"
tokenmon-provider-grok = { path = "../crates/tokenmon-provider-grok" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
reqwest = { version = "0.13", default-features = false }
tokenmon-platform = { path = "../crates/tokenmon-platform" }
tokenmon-core = { path = "../crates/tokenmon-core" }
tempfile = "3"
tokenmon-provider-claude = { path = "../crates/tokenmon-provider-claude" }
tokenmon-provider-cursor = { path = "../crates/tokenmon-provider-cursor" }
arbitrary = { version = "1", features = ["derive"] }
serde_json = "1.0"
tokenmon-provider-grokbot = { path = "../crates/tokenmon-provider-grokbot" }
url = "2.5"

# Own workspace: nightly-only, never built by the stable workspace gate.
[workspace]

# Fuzz targets are autodiscovered from `src/bin/<target>.rs`: there is NO
# `[[bin]]` list here. Adding a target means adding one file (plus a seed
# corpus directory); this manifest is not touched, so parallel branches never
# conflict on it. Only add a dependency line when a new workspace crate is
# first fuzzed.
