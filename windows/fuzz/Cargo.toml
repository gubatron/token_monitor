[package]
name = "tokenmon-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
reqwest = { version = "0.13", default-features = false }
tokenmon-platform = { path = "../crates/tokenmon-platform" }
tokenmon-core = { path = "../crates/tokenmon-core" }

# Own workspace: nightly-only, never built by the stable workspace gate.
[workspace]

[[bin]]
name = "platform_shell_ipc"
path = "fuzz_targets/platform_shell_ipc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "platform_shell_cmdline"
path = "fuzz_targets/platform_shell_cmdline.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tokenmon_core_settings_decode"
path = "fuzz_targets/tokenmon_core_settings_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tokenmon_core_threshold_notifier"
path = "fuzz_targets/tokenmon_core_threshold_notifier.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tokenmon_core_overview_history"
path = "fuzz_targets/tokenmon_core_overview_history.rs"
test = false
doc = false
bench = false

[[bin]]
name = "net_retry_after"
path = "fuzz_targets/net_retry_after.rs"
test = false
doc = false

[[bin]]
name = "net_challenge"
path = "fuzz_targets/net_challenge.rs"
test = false
doc = false

[[bin]]
name = "net_set_cookie"
path = "fuzz_targets/net_set_cookie.rs"
test = false
doc = false
