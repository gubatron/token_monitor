[package]
name = "tokenmon-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
tokenmon-provider-openrouter = { path = "../crates/tokenmon-provider-openrouter" }
libfuzzer-sys = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
reqwest = { version = "0.13", default-features = false }
tokenmon-platform = { path = "../crates/tokenmon-platform" }
tokenmon-core = { path = "../crates/tokenmon-core" }
arbitrary = { version = "1", features = ["derive"] }
serde_json = "1.0"

# Own workspace: nightly-only, never built by the stable workspace gate.
[workspace]

[[bin]]
name = "platform_shell_ipc"
path = "fuzz_targets/platform_shell_ipc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "platform_shell_cmdline"
path = "fuzz_targets/platform_shell_cmdline.rs"
test = false
doc = false
bench = false

